[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landmark-field-network"
version = "0.1.0"
description = "Network-aware upstream project selection, timing, and value attribution"
requires-python = ">=3.11"
dependencies = [
  "pyomo>=6.7",
  "highspy>=1.7",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pareto = ["project-pareto>=0.9"]
economics = ["sqlalchemy>=2.0"]  # landmark-economics resolved from workspace path

[project.scripts]
field-network = "landmark_field_network.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
landmark_field_network = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
